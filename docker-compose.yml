services:
  emulator:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: ra-emulator:latest
    container_name: emulator
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./data:/app/data
    env_file:
      - .env
    environment:
      PYTHONUNBUFFERED: "1"
    restart: unless-stopped
    networks:
      - ra-network

networks:
  ra-network:
    name: ra-network
